    <!-- Restore client-side routes redirected by GitHub Pages' 404 fallback. -->
    <script>
      (function restoreGitHubPagesRoute(location) {
        if (location.search.charAt(1) !== '/') return;

        var route = location.search
          .slice(1)
          .split('&')
          .map(function decodeRoutePart(part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');

        window.history.replaceState(
          null,
          '',
          location.pathname.slice(0, -1) + route + location.hash,
        );
      })(window.location);
    </script>
